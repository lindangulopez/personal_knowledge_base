site_name: Linda Angulo Lopez
site_description: Functional ecologist working in open science. Research software preservation, landscape connectivity and field illustration.
site_author: Linda Angulo Lopez
site_url: https://lindangulopez.github.io/personal_knowledge_base/
repo_url: https://github.com/lindangulopez/personal_knowledge_base
repo_name: lindangulopez/personal_knowledge_base
edit_uri: edit/main/notes/

docs_dir: notes

theme:
  name: material
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

hooks:
  - hooks.py

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - stylesheets/site-teal.css

extra_javascript:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - javascripts/career-map.js

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/lindangulopez/
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/lindangulopez
      name: GitHub
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0009-5689-7148
      name: ORCID
    - icon: fontawesome/solid/book-open
      link: https://zenodo.org/search?q=metadata.creators.person_or_org.name%3A%22Angulo%20Lopez%2C%20Linda%22
      name: Zenodo records

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_url_format: "{slug}"
      post_excerpt: required
      archive: false
      categories: true
  - roamlinks

nav:
  - Home: index.md
  - News: news.md
  - Blog:
    - blog/index.md
  - Publications: Publications.md
  - Notes:
    - Agentic Coding: Agentic_Coding.md
    - Remote Sensing: Remote_Sensing.md
    - Agriculture: Agriculture.md
    - Climate Change: Climate_Change.md
    - Embeddings: Embeddings.md
    - Machine Learning: Machine_Learning.md
    - Python: Python.md
    - SQL: SQL.md
    - Reproducible Science: Reproducible_Science.md
    - Data: Data.md
    - Conservation: Conservation.md
    - Urban Planning: Urban_Planning.md
    - Safe and Just: Safe_and_Just.md
    - Decolonial Ecology: Decolonial_Ecology.md
    - Political Ecology: Political_Ecology.md
    - Critical Raw Materials: Critical_Raw_Materials.md
    - Environmental Justice: Environmental_Justice.md
    - Cartography: Cartography.md
    - Professional Background: Professional_Background.md
    - Careers and Leadership: Careers_and_Leadership.md
    - CodeMeta Meeting Notes: codeMeta_meeting.md
    - Open Source: Open_Source.md
    - Changelog: log.md
