site_name: Linda's Notes
site_url: https://lindangulopez.github.io/personal_knowledge_base/
repo_url: https://github.com/lindangulopez/personal_knowledge_base
repo_name: lindangulopez/personal_knowledge_base
edit_uri: edit/main/notes/

docs_dir: notes

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

hooks:
  - hooks.py

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search
  - roamlinks

nav:
  - Home:
    - index.md
    - Remote Sensing: Remote_Sensing.md
    - Agriculture: Agriculture.md
    - Climate Change: Climate_Change.md
    - Embeddings: Embeddings.md
    - Machine Learning: Machine_Learning.md
    - Python: Python.md
    - Reproducible Science: Reproducible_Science.md
    - Data: Data.md
    - Conservation: Conservation.md
    - Urban Planning: Urban_Planning.md
    - Safe and Just: Safe_and_Just.md
    - Decolonial Ecology: Decolonial_Ecology.md
    - Political Ecology: Political_Ecology.md
    - Cartography: Cartography.md
    - Publications: Publications.md
    - Professional Background: Professional_Background.md
    - Changelog: log.md
